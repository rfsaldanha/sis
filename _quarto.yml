execute:
  freeze: auto

lang: pt 
language:
  title-block-published: "Data da Última Atualização"

book:
  title: "Sistemas de Informação em Saúde no Brasil"
  author: "Raphael de Freitas Saldanha"
  isbn: "978-65-01-37841-1"
  description: "Livro sobre os principais Sistemas de Informação em Saúde no Brasil."
  site-url: "https://rfsaldanha.github.io/sis/"
  repo-url: "https://github.com/rfsaldanha/sis"
  repo-actions: [source, issue]
  date: today
  search: true
  google-analytics: 
    tracking-id: G-2M7VLSRDCB
    anonymize-ip: false
  chapters:
    - index.qmd
    - siglas.qmd
    - introducao.qmd
    - historico.qmd
    - organizacao.qmd
    - eventos.qmd
    - sim.qmd
    - sinasc.qmd
    - sih.qmd
    - sia.qmd
    - sinan.qmd
    - cnes.qmd
    - siscan.qmd
    - sisagua.qmd
    - siops.qmd
    - sisaps.qmd
    - sipni.qmd
    - rnds.qmd
    - referencias.qmd
  appendices:
    - quadro_resumo.qmd
    - cid.qmd
    - codmun.qmd
    - pop.qmd
    - inqueritos.qmd
    - sivep.qmd
    - sisvan.qmd
    - ans.qmd
    - interoperabilidade.qmd
    - indice.qmd
    #- vigitel.qmd
    #- pns.qmd
    #- rnds.qmd
    #- esus-not.qmd


bibliography: references.bib
csl: abnt.csl

crossref:
  chapters: true
  custom:
    - kind: float
      key: qua
      reference-prefix: "Quadro"
      caption-prefix: "Quadro"
      caption-location: top

format:
  html:
    theme:
      light: journal
      dark: darkly
    css: styles.css
